<title>Hotaru</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap">
<style>
/* Hotaru commits to one visual world — a dark field at night. Every colour is
   painted explicitly so the page holds whatever ground the host puts behind it. */
:root {
  color-scheme: dark;
  --ink:    #04050A;
  --ink-2:  #090B14;
  --glass:  rgba(12, 15, 24, 0.62);
  --edge:   rgba(255, 214, 150, 0.16);
  --edge-2: rgba(255, 214, 150, 0.30);
  --text:   #EDE4D6;
  --text-2: rgba(237, 228, 214, 0.62);
  --text-3: rgba(237, 228, 214, 0.34);
  --amber:  #FFC15E;
  --amber-2:#FF9E3D;
  --jp: "Zen Kaku Gothic New", ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--jp);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: radial-gradient(120% 90% at 50% 45%, #0A0C16 0%, #04050A 70%);
  touch-action: none;
  cursor: crosshair;
}

.ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  gap: 12px;
}
.ui > * { min-width: 0; }

/* ── wordmark ──────────────────────────────────────────────────────── */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.mark { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mark .kanji {
  font-family: var(--mincho);
  font-weight: 900;
  font-size: 30px;
  line-height: 1;
  color: var(--amber);
  text-shadow: 0 0 22px rgba(255, 158, 61, 0.55), 0 0 60px rgba(255, 158, 61, 0.22);
}
.mark .name {
  font-family: var(--mincho);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.34em;
  color: var(--text-2);
  text-transform: uppercase;
}
.mark .sub {
  flex-basis: 100%;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  color: var(--text-2);
  margin-top: 2px;
}
/* The field behind the overlay can be bright, so every floating label carries
   its own shadow rather than trusting the background to stay dark. */
.mark .name, .mark .sub, .hud, .hint {
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.92), 0 0 3px rgba(0, 0, 0, 0.85);
}

.hud {
  text-align: right;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.7;
  letter-spacing: 0.04em;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.hud b { font-weight: 400; color: var(--amber); }

/* ── hint ──────────────────────────────────────────────────────────── */
.hint {
  align-self: end;
  justify-self: center;
  font-size: 12px;
  letter-spacing: 0.14em;
  color: var(--text-2);
  padding-bottom: 6px;
  opacity: 0;
  animation: hint 7.5s ease-in-out 1.2s forwards;
}
@keyframes hint {
  0% { opacity: 0; transform: translateY(6px); }
  14% { opacity: 1; transform: none; }
  78% { opacity: 1; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .hint { animation: none; opacity: 1; } }

/* ── dock ──────────────────────────────────────────────────────────── */
.dock {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.field {
  pointer-events: auto;
  position: relative;
  display: flex;
  align-items: center;
  width: min(420px, 100%);
  background: var(--glass);
  border: 1px solid var(--edge);
  border-radius: 999px;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  transition: border-color .2s, box-shadow .2s;
}
.field:focus-within {
  border-color: var(--edge-2);
  box-shadow: 0 0 0 3px rgba(255, 193, 94, 0.09), 0 10px 40px rgba(0, 0, 0, 0.5);
}
.field input {
  flex: 1;
  min-width: 0;
  padding: 11px 6px 11px 20px;
  border: 0;
  background: none;
  outline: none;
  color: var(--text);
  font-family: var(--jp);
  font-size: 15px;
  letter-spacing: 0.08em;
}
.field input::placeholder { color: var(--text-3); letter-spacing: 0.1em; }
.field button {
  flex: none;
  width: 34px; height: 34px;
  margin-right: 5px;
  border: 0; border-radius: 50%;
  background: none;
  color: var(--text-3);
  font-size: 17px; line-height: 1;
  cursor: pointer;
  transition: color .15s, background .15s;
}
.field button:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }

/* The one verb on the page: stop holding the shape together and let the
   particles pull on each other instead. */
.release {
  pointer-events: auto;
  padding: 9px 26px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--amber), var(--amber-2));
  color: #21160A;
  font-family: var(--mincho);
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-indent: 0.28em;
  cursor: pointer;
  box-shadow: 0 0 26px rgba(255, 158, 61, 0.35), 0 6px 20px rgba(0, 0, 0, 0.45);
  transition: transform .14s, box-shadow .2s, filter .2s;
}
.release:hover { filter: brightness(1.08); box-shadow: 0 0 34px rgba(255, 158, 61, 0.5), 0 6px 20px rgba(0, 0, 0, 0.45); }
.release:active { transform: translateY(1px); }
.release[hidden] { display: none !important; }
.release.on {
  background: none;
  border: 1px solid var(--edge-2);
  color: var(--text-2);
  box-shadow: none;
  font-weight: 400;
}

.chips {
  pointer-events: auto;
  display: flex;
  gap: 6px;
  max-width: 100%;
  overflow-x: auto;
  padding: 2px 2px 4px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none;
  padding: 6px 14px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text-2);
  font-family: var(--jp);
  font-size: 12.5px;
  letter-spacing: 0.1em;
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, border-color .15s, background .15s;
}
.chips button:hover { color: var(--text); border-color: var(--edge-2); }
.chips button[aria-pressed="true"] {
  color: var(--ink);
  background: linear-gradient(180deg, var(--amber), var(--amber-2));
  border-color: transparent;
  font-weight: 700;
}

:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

/* ── failure card ──────────────────────────────────────────────────── */
.fail {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(4, 5, 10, 0.92);
  pointer-events: auto;
}
.fail[hidden] { display: none !important; }
.fail div {
  max-width: 34em;
  text-align: center;
}
.fail h2 {
  margin: 0 0 10px;
  font-family: var(--mincho);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--amber);
}
.fail p { margin: 0 0 6px; color: var(--text-2); font-size: 13.5px; }
.fail code {
  display: block;
  margin-top: 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  word-break: break-word;
}

@media (max-width: 560px) {
  .mark .kanji { font-size: 25px; }
  .mark .name { font-size: 12.5px; letter-spacing: 0.26em; }
  .mark .sub { display: none; }
  .hud { font-size: 9.5px; }
  .field input { font-size: 16px; }
}
</style>

<canvas id="stage" aria-label="光の粒子で描かれる文字と形"></canvas>

<div class="ui">
  <div class="top">
    <div class="mark">
      <span class="kanji">蛍</span>
      <span class="name">Hotaru</span>
      <span class="sub">百万の光が言葉のかたちに集まり、放てば自らの重力で崩れる</span>
    </div>
    <div class="hud" id="hud"></div>
  </div>

  <div class="hint" id="hint">なぞると光が散り、「放つ」で重力に委ねられます</div>

  <div class="dock">
    <div class="field">
      <input id="word" type="text" maxlength="14" placeholder="名前や言葉を入力"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        aria-label="光で描く言葉">
      <button id="clear" type="button" aria-label="消す">&times;</button>
    </div>
    <button class="release" id="release" type="button" hidden>放つ</button>
    <div class="chips" id="chips" role="group" aria-label="かたちを選ぶ"></div>
  </div>
</div>

<div class="fail" id="fail" hidden>
  <div>
    <h2>この画面では光を灯せません</h2>
    <p id="fail-msg"></p>
    <p>WebGL に対応した最新の Chrome、Safari、Firefox でお試しください。</p>
    <code id="fail-detail"></code>
  </div>
</div>

<script>
/* ─── hotaru/noise.js ───────────────────────────────────────────── */
/* ─────────────────────────────────────────────────────────────────────────────
   Hotaru · noise
   ---------------------------------------------------------------------------
   GLSL ES 3.00 source for 3D simplex noise, fBm and curl noise, plus a
   JavaScript mirror of each so the shaders can be validated on the CPU.

   The simplex implementation is the Ashima Arts / Stefan Gustavson
   "webgl-noise" noise3D.glsl (MIT / public domain), transcribed verbatim.
   The JavaScript below is a line-for-line scalar expansion of that same
   source: every constant is written with the same literal it has in the
   shader (1.0/6.0, 289.0, 34.0, 49.0, 0.142857142857, 1.79284291400159,
   0.85373472095314, 0.6, 42.0) so that test/noise.test.js can diff the two
   textually as well as numerically.

   Plain script. Publishes exactly one global: HotaruNoise.
   No import/export, no require, no window, no document, no Math.random.
   ───────────────────────────────────────────────────────────────────────── */
(function (root) {
  "use strict";

  /* ═══════════════════════════════════════════════════════════════════════
     1. GLSL — simplex 3D (Ashima Arts / Stefan Gustavson, verbatim)

     One deliberate property of this implementation is worth knowing before
     you build on it: the kernel radius is 0.6 (max(0.6 - r*r, 0.0)), not the
     0.5 that would make the kernel vanish exactly at the neighbouring corner.
     0.6 gives noticeably more contrast — which is why webgl-noise ships it —
     at the cost of a small step at simplex cell boundaries, where a corner
     enters or leaves the sum while its weight is still non-zero. Measured
     over thousands of bisected boundary crossings that step is at most about
     6e-3 out of a [-1, 1] range (mean 3e-4), on a measure-zero surface.
     It is invisible in the field and harmless to the curl's divergence, which
     is an exact discrete identity rather than a property of smoothness.
     Kept as-is: this is the reference implementation, not a variant of it.
     ═══════════════════════════════════════════════════════════════════════ */

  var GLSL_SIMPLEX3 = [
    "// Description : Array and textureless GLSL 2D/3D/4D simplex",
    "//               noise functions.",
    "//      Author : Ian McEwan, Ashima Arts.",
    "//  Maintainer : stegu",
    "//     Lastmod : 20110822 (ijm)",
    "//     License : Copyright (C) 2011 Ashima Arts. All rights reserved.",
    "//               Distributed under the MIT License. See LICENSE file.",
    "//               https://github.com/ashima/webgl-noise",
    "//               https://github.com/stegu/webgl-noise",
    "",
    "vec3 mod289(vec3 x) {",
    "  return x - floor(x * (1.0 / 289.0)) * 289.0;",
    "}",
    "",
    "vec4 mod289(vec4 x) {",
    "  return x - floor(x * (1.0 / 289.0)) * 289.0;",
    "}",
    "",
    "vec4 permute(vec4 x) {",
    "     return mod289(((x*34.0)+1.0)*x);",
    "}",
    "",
    "vec4 taylorInvSqrt(vec4 r) {",
    "  return 1.79284291400159 - 0.85373472095314 * r;",
    "}",
    "",
    "float snoise(vec3 v) {",
    "  const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;",
    "  const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);",
    "",
    "// First corner",
    "  vec3 i  = floor(v + dot(v, C.yyy) );",
    "  vec3 x0 =   v - i + dot(i, C.xxx) ;",
    "",
    "// Other corners",
    "  vec3 g = step(x0.yzx, x0.xyz);",
    "  vec3 l = 1.0 - g;",
    "  vec3 i1 = min( g.xyz, l.zxy );",
    "  vec3 i2 = max( g.xyz, l.zxy );",
    "",
    "  //   x0 = x0 - 0.0 + 0.0 * C.xxx;",
    "  //   x1 = x0 - i1  + 1.0 * C.xxx;",
    "  //   x2 = x0 - i2  + 2.0 * C.xxx;",
    "  //   x3 = x0 - 1.0 + 3.0 * C.xxx;",
    "  vec3 x1 = x0 - i1 + C.xxx;",
    "  vec3 x2 = x0 - i2 + C.yyy; // 2.0*C.x = 1/3 = C.y",
    "  vec3 x3 = x0 - D.yyy;      // -1.0+3.0*C.x = -0.5 = -D.y",
    "",
    "// Permutations",
    "  i = mod289(i);",
    "  vec4 p = permute( permute( permute(",
    "             i.z + vec4(0.0, i1.z, i2.z, 1.0 ))",
    "           + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))",
    "           + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));",
    "",
    "// Gradients: 7x7 points over a square, mapped onto an octahedron.",
    "// The ring size 17*17 = 289 is close to a multiple of 49 (49*6 = 294)",
    "  float n_ = 0.142857142857; // 1.0/7.0",
    "  vec3  ns = n_ * D.wyz - D.xzx;",
    "",
    "  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);  //  mod(p,7*7)",
    "",
    "  vec4 x_ = floor(j * ns.z);",
    "  vec4 y_ = floor(j - 7.0 * x_ );    // mod(j,N)",
    "",
    "  vec4 x = x_ *ns.x + ns.yyyy;",
    "  vec4 y = y_ *ns.x + ns.yyyy;",
    "  vec4 h = 1.0 - abs(x) - abs(y);",
    "",
    "  vec4 b0 = vec4( x.xy, y.xy );",
    "  vec4 b1 = vec4( x.zw, y.zw );",
    "",
    "  //vec4 s0 = vec4(lessThan(b0,0.0))*2.0 - 1.0;",
    "  //vec4 s1 = vec4(lessThan(b1,0.0))*2.0 - 1.0;",
    "  vec4 s0 = floor(b0)*2.0 + 1.0;",
    "  vec4 s1 = floor(b1)*2.0 + 1.0;",
    "  vec4 sh = -step(h, vec4(0.0));",
    "",
    "  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;",
    "  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;",
    "",
    "  vec3 p0 = vec3(a0.xy,h.x);",
    "  vec3 p1 = vec3(a0.zw,h.y);",
    "  vec3 p2 = vec3(a1.xy,h.z);",
    "  vec3 p3 = vec3(a1.zw,h.w);",
    "",
    "//Normalise gradients",
    "  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));",
    "  p0 *= norm.x;",
    "  p1 *= norm.y;",
    "  p2 *= norm.z;",
    "  p3 *= norm.w;",
    "",
    "// Mix final noise value",
    "  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);",
    "  m = m * m;",
    "  return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1),",
    "                                dot(p2,x2), dot(p3,x3) ) );",
    "}",
    ""
  ].join("\n");

  /* ═══════════════════════════════════════════════════════════════════════
     2. GLSL — fBm (lacunarity 2.0, gain 0.5, amplitude-normalised)
     ═══════════════════════════════════════════════════════════════════════ */

  // Each octave is shifted by a fixed irrational-looking vector so the octaves
  // do not all share the same lattice phase at the origin (which would show up
  // as a static "hot spot" in the middle of the field).
  var FBM_SHIFT_X = 17.31;
  var FBM_SHIFT_Y = 9.73;
  var FBM_SHIFT_Z = 23.17;
  var FBM_MAX_OCTAVES = 8;

  var GLSL_FBM3 = [
    "// Fractal Brownian motion over snoise().",
    "// lacunarity 2.0, gain 0.5, divided by the sum of the amplitudes so the",
    "// result stays inside roughly [-1, 1] for any octave count.",
    "// Requires: snoise(vec3)",
    "float fbm(vec3 p, int octaves) {",
    "  float sum  = 0.0;",
    "  float amp  = 0.5;",
    "  float norm = 0.0;",
    "  vec3  q    = p;",
    "  for (int i = 0; i < 8; i++) {",
    "    if (i >= octaves) break;",
    "    sum  += amp * snoise(q);",
    "    norm += amp;",
    "    amp  *= 0.5;                                       // gain",
    "    q     = q * 2.0 + vec3(17.31, 9.73, 23.17);        // lacunarity + shift",
    "  }",
    "  return norm > 0.0 ? sum / norm : 0.0;",
    "}",
    ""
  ].join("\n");

  /* ═══════════════════════════════════════════════════════════════════════
     3. GLSL — curl noise (divergence-free by construction)
     ═══════════════════════════════════════════════════════════════════════ */

  // Three fixed offsets, far enough apart that the three potential components
  // are effectively independent scalar fields (simplex noise decorrelates over
  // about one lattice unit; these are ~100 apart in every pair), yet small
  // enough that mediump/highp float32 still resolves the epsilon step.
  var CURL_O1 = [37.13, 11.71, 83.29];
  var CURL_O2 = [-19.43, 67.87, -41.51];
  var CURL_O3 = [91.77, -53.19, 23.63];
  var CURL_EPS = 0.01;

  var GLSL_CURL3 = [
    "// Curl of a vector potential built from three decorrelated snoise fields.",
    "// Because curl(psi) is taken with central differences and div() of a",
    "// central-difference curl is an exactly cancelling sum of commuting",
    "// difference operators, the sampled field is divergence-free to rounding.",
    "// Requires: snoise(vec3), and precision highp float.",
    "//",
    "// REQUIRES highp. The central difference adds 0.01 to coordinates that are",
    "// already offset by up to ~92, so the step must survive the addition. highp",
    "// (float32) resolves it down to about 1e-5 of a unit and stays exact for",
    "// |p| up to ~1e4; mediump (float16 on mobile, ~1e-3 relative) would swallow",
    "// the step entirely and return a zero or garbage field.",
    "const float HOTARU_CURL_EPS = 0.01;",
    "",
    "vec3 hotaruPotential(vec3 p) {",
    "  return vec3(",
    "    snoise(p + vec3( 37.13,  11.71,  83.29)),",
    "    snoise(p + vec3(-19.43,  67.87, -41.51)),",
    "    snoise(p + vec3( 91.77, -53.19,  23.63))",
    "  );",
    "}",
    "",
    "vec3 curlNoise(vec3 p) {",
    "  float e = HOTARU_CURL_EPS;",
    "  vec3 dx = vec3(e, 0.0, 0.0);",
    "  vec3 dy = vec3(0.0, e, 0.0);",
    "  vec3 dz = vec3(0.0, 0.0, e);",
    "",
    "  vec3 xm = hotaruPotential(p - dx);",
    "  vec3 xp = hotaruPotential(p + dx);",
    "  vec3 ym = hotaruPotential(p - dy);",
    "  vec3 yp = hotaruPotential(p + dy);",
    "  vec3 zm = hotaruPotential(p - dz);",
    "  vec3 zp = hotaruPotential(p + dz);",
    "",
    "  //  curl = ( dPz/dy - dPy/dz, dPx/dz - dPz/dx, dPy/dx - dPx/dy )",
    "  float cx = (yp.z - ym.z) - (zp.y - zm.y);",
    "  float cy = (zp.x - zm.x) - (xp.z - xm.z);",
    "  float cz = (xp.y - xm.y) - (yp.x - ym.x);",
    "",
    "  return vec3(cx, cy, cz) / (2.0 * e);",
    "}",
    ""
  ].join("\n");

  var PRELUDE = GLSL_SIMPLEX3 + "\n" + GLSL_FBM3 + "\n" + GLSL_CURL3;

  /* ═══════════════════════════════════════════════════════════════════════
     4. JavaScript mirror
     ═══════════════════════════════════════════════════════════════════════ */

  var floor = Math.floor;
  var abs = Math.abs;
  var min = Math.min;
  var max = Math.max;
  var f32 = Math.fround;

  // const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  var C = [1.0 / 6.0, 1.0 / 3.0];
  // const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  var D = [0.0, 0.5, 1.0, 2.0];

  /* Two of the shader's literals sit exactly on a floor() boundary, so the
     branch they take depends on how the literal was rounded. A GLSL compiler
     stores them as float32, and BOTH round UP:

       float32(1.0/289.0)      = 0.0034602077212184668  >  1/289
       float32(0.142857142857) = 0.1428571492433548     >  1/7

    var prev = 0;

      var next = Math.floor(((c + 1) * n) / total);
      if (next > prev) {
        visit(emitted++, c % cols, Math.floor(c / cols), cols, rows);
      }
      prev = next;
    }
    /* Defensive: rounding can never leave this short, but never emit garbage. */
    while (emitted < n) {
      visit(emitted, emitted % cols, Math.floor(emitted / cols) % rows, cols, rows);
      emitted++;
    }
  }

  /* ── final safety fit ──────────────────────────────────────────────────── */

  /* Shrink (never grow) the cloud so nothing escapes the unit sphere. Generators
     are tuned to land inside on their own; this is the belt to that braces. */
  function fit(out, limit) {
    var n = out.length;
    var maxSq = 0;
    for (var i = 0; i < n; i += 3) {
      var d = out[i] * out[i] + out[i + 1] * out[i + 1] + out[i + 2] * out[i + 2];
      if (d > maxSq) maxSq = d;
    }
    var max = Math.sqrt(maxSq);
    if (max > limit && max > 0) {
      var s = limit / max;
      for (var j = 0; j < n; j++) out[j] *= s;
    }
    return out;
  }

  /* ══ sphere ════════════════════════════════════════════════════════════ */

  /* Fibonacci (golden-angle) lattice: equal-area bands in y, golden-angle steps
     in longitude. Spacing is as even as a deterministic sphere covering gets —
     no pole clustering, no seams. opts.shell lets points sink inward, sampled
     uniformly in volume across the shell so the density stays flat. */
  function sphere(count, opts) {
    var out = alloc(count);
    var n = out.length / 3;
    if (n === 0) return out;

    var shell = clamp(pick(opts, 'shell', 0), 0, 1);
    var radius = pick(opts, 'radius', 1);
    var rng = mulberry32(hashSeed(opts && opts.seed));
    var q = randomQuat(rng);

    var inner = 1 - shell;
    var inner3 = inner * inner * inner;
    var v = [0, 0, 0];

    for (var i = 0; i < n; i++) {
      var y = 1 - (2 * i + 1) / n;
      var s = Math.sqrt(Math.max(0, 1 - y * y));
      var th = GOLDEN_ANGLE * i;
      var r = radius;
      if (shell > 0) {
        /* stratified so the radial spread stays smooth at any count */
        var u = (i + rng()) / n;
        r = radius * Math.cbrt(inner3 + (1 - inner3) * u);
      }
      rotateByQuat(q, Math.cos(th) * s, y, Math.sin(th) * s, v);
      var o = i * 3;
      out[o] = v[0] * r;
      out[o + 1] = v[1] * r;
      out[o + 2] = v[2] * r;
    }
    return fit(out, FIT_LIMIT);
  }

  /* ══ galaxy ════════════════════════════════════════════════════════════ */

  /* A grand-design spiral: exponential disc (dense core, sparse rim), arms laid
     on a logarithmic spiral theta = ln(r/r0)/tan(pitch), angular scatter that
     widens outward, a disc that thins outward, a flattened central bulge, and a
     pinch of inter-arm stars so the arms have something to stand out against. */
  function galaxy(count, opts) {
    var out = alloc(count);
    var n = out.length / 3;
    if (n === 0) return out;

    var arms = Math.max(1, Math.round(pick(opts, 'arms', 3)));
    var pitch = pick(opts, 'pitch', 0.235);          /* radians; 13.5 deg */
    var spread = pick(opts, 'spread', 0.155);        /* arm half-width, radians */
    var bulgeFrac = clamp(pick(opts, 'bulge', 0.17), 0, 1);
    var bulgeRadius = pick(opts, 'bulgeRadius', 0.2);
    var thickness = pick(opts, 'thickness', 0.062);
    var scaleLength = pick(opts, 'scaleLength', 0.28); /* exponential disc h */
    var interArm = clamp(pick(opts, 'interArm', 0.11), 0, 1);
    var rMax = pick(opts, 'radius', 0.97);
    var spin = pick(opts, 'spin', 1) >= 0 ? 1 : -1;

    var rng = mulberry32(hashSeed(opts && opts.seed));
    var phase = rng() * TAU;

    /* N(r) dr ∝ r * exp(-r/h) dr — a real exponential disc — with the rim
       feathered off so the galaxy dissolves instead of ending at a wall. */
    var cdf = buildCdf(1024, function (x) {
      var r = x * rMax;
      var edge = 1 - smoothstep(0.78, 1, x) * 0.93;
      return r * Math.exp(-r / scaleLength) * edge;
    });

    var rMin = 0.055;                  /* spiral reference radius */
    var invTan = 1 / Math.tan(pitch);
    var armStep = TAU / arms;

    var nBulge = Math.round(n * bulgeFrac);
    var nDisc = n - nBulge;
    var bAcc = 0, bUsed = 0, dUsed = 0;

    for (var i = 0; i < n; i++) {
      var o = i * 3;
      var x, y, z;
      bAcc += bulgeFrac;
      if (bAcc >= 1 && bUsed < nBulge) {
        /* ── bulge: flattened, steeply concentrated spheroid ── */
        bAcc -= 1;
        var ub = (bUsed + rng()) / Math.max(1, nBulge);
        var rb = bulgeRadius * Math.pow(ub, 1.55);
        var cz = rng() * 2 - 1;
        var sa = Math.sqrt(Math.max(0, 1 - cz * cz));
        var ang = rng() * TAU;
        x = rb * sa * Math.cos(ang);
        z = rb * sa * Math.sin(ang);
        y = rb * cz * 0.6;
        bUsed++;
      } else {
        /* ── disc: logarithmic spiral arms ── */
        var ud = (dUsed + rng()) / Math.max(1, nDisc);
        var r = sampleCdf(cdf, ud) * rMax;
        dUsed++;

        var wind = Math.log(Math.max(r, rMin) / rMin) * invTan * spin;
        var th;
        if (rng() < interArm) {
          th = rng() * TAU;                       /* field star */
        } else {
          var arm = i % arms;
          var sigma = spread * (0.45 + 0.8 * (r / rMax));
          th = arm * armStep + wind + gaussClamped(rng, 2.6) * sigma;
        }
        th += phase;

        /* disc scale height falls off outward: thin, flaring core */
        var hz = thickness * Math.exp(-r / 0.42);
        x = r * Math.cos(th);
        z = r * Math.sin(th);
        y = gaussClamped(rng, 2.6) * hz;
      }
      out[o] = x;
      out[o + 1] = y;
      out[o + 2] = z;
    }
    return fit(out, FIT_LIMIT);
  }

  /* ══ torus knot ════════════════════════════════════════════════════════ */

  /* Points on the tube around a (p,q) torus knot. The curve is tabulated once,
     re-parameterised by arc length (raw t bunches badly where the curve bends),
     and carried by a rotation-minimising frame whose closing twist is undone so
     the tube has no seam. */
  function torusKnot(count, opts) {
    var out = alloc(count);
    var n = out.length / 3;
    if (n === 0) return out;

    var p = Math.max(1, Math.round(pick(opts, 'p', 2)));
    var q = Math.max(1, Math.round(pick(opts, 'q', 3)));
    var tube = Math.max(0, pick(opts, 'tube', 0.12));
    var fill = clamp(pick(opts, 'fill', 0.3), 0, 1); /* radial thickness of the shell */
    var rng = mulberry32(hashSeed(opts && opts.seed));

    var SAMPLES = 2048;
    var px = new Float64Array(SAMPLES + 1);
    var py = new Float64Array(SAMPLES + 1);
    var pz = new Float64Array(SAMPLES + 1);
    var tx = new Float64Array(SAMPLES + 1);
    var ty = new Float64Array(SAMPLES + 1);
    var tz = new Float64Array(SAMPLES + 1);
    var nx = new Float64Array(SAMPLES + 1);
    var ny = new Float64Array(SAMPLES + 1);
    var nz = new Float64Array(SAMPLES + 1);
    var arc = new Float64Array(SAMPLES + 1);

    var i, t, rr, maxR = 0;
    for (i = 0; i <= SAMPLES; i++) {
      t = (i / SAMPLES) * TAU;
      rr = Math.cos(q * t) + 2;
      px[i] = rr * Math.cos(p * t);
      py[i] = rr * Math.sin(p * t);
      pz[i] = -Math.sin(q * t);
      /* analytic tangent keeps the frame clean at the seam */
      var dr = -q * Math.sin(q * t);
      var dx = dr * Math.cos(p * t) - rr * p * Math.sin(p * t);
      var dy = dr * Math.sin(p * t) + rr * p * Math.cos(p * t);
      var dz = -q * Math.cos(q * t);
      var dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      tx[i] = dx / dl; ty[i] = dy / dl; tz[i] = dz / dl;
      var rad = Math.sqrt(px[i] * px[i] + py[i] * py[i] + pz[i] * pz[i]);
      if (rad > maxR) maxR = rad;
    }
    for (i = 1; i <= SAMPLES; i++) {
      var ax = px[i] - px[i - 1], ay = py[i] - py[i - 1], az = pz[i] - pz[i - 1];
      arc[i] = arc[i - 1] + Math.sqrt(ax * ax + ay * ay + az * az);
    }
    var length = arc[SAMPLES];

    /* parallel transport: start with any normal, rotate it by the minimal
       rotation that carries each tangent to the next */
    var seedVec = Math.abs(tz[0]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
    var n0x = ty[0] * seedVec[2] - tz[0] * seedVec[1];
    var n0y = tz[0] * seedVec[0] - tx[0] * seedVec[2];
    var n0z = tx[0] * seedVec[1] - ty[0] * seedVec[0];
    var n0l = Math.sqrt(n0x * n0x + n0y * n0y + n0z * n0z) || 1;
    nx[0] = n0x / n0l; ny[0] = n0y / n0l; nz[0] = n0z / n0l;
    var tmp = [0, 0, 0];
    for (i = 1; i <= SAMPLES; i++) {
      var cx = ty[i - 1] * tz[i] - tz[i - 1] * ty[i];
      var cy = tz[i - 1] * tx[i] - tx[i - 1] * tz[i];
      var cz = tx[i - 1] * ty[i] - ty[i - 1] * tx[i];
      var sn = Math.sqrt(cx * cx + cy * cy + cz * cz);
      if (sn < 1e-12) {
        nx[i] = nx[i - 1]; ny[i] = ny[i - 1]; nz[i] = nz[i - 1];
      } else {
        var cs = tx[i - 1] * tx[i] + ty[i - 1] * ty[i] + tz[i - 1] * tz[i];
        rotateAxis(nx[i - 1], ny[i - 1], nz[i - 1], cx / sn, cy / sn, cz / sn, Math.atan2(sn, cs), tmp);
        nx[i] = tmp[0]; ny[i] = tmp[1]; nz[i] = tmp[2];
      }
    }
    /* undo the holonomy accumulated over the loop, spread along arc length */
    var hx = ny[0] * nz[SAMPLES] - nz[0] * ny[SAMPLES];
    var hy = nz[0] * nx[SAMPLES] - nx[0] * nz[SAMPLES];
    var hz2 = nx[0] * ny[SAMPLES] - ny[0] * nx[SAMPLES];
    var sinH = hx * tx[0] + hy * ty[0] + hz2 * tz[0];
    var cosH = nx[0] * nx[SAMPLES] + ny[0] * ny[SAMPLES] + nz[0] * nz[SAMPLES];
    var holo = Math.atan2(sinH, cosH);
    for (i = 0; i <= SAMPLES; i++) {
      var k = length > 0 ? arc[i] / length : 0;
      rotateAxis(nx[i], ny[i], nz[i], tx[i], ty[i], tz[i], -holo * k, tmp);
      nx[i] = tmp[0]; ny[i] = tmp[1]; nz[i] = tmp[2];
    }

    /* Exact fit: the widest point of the tube is
         max_phi |s*P + tube*(cos phi N + sin phi B)|
               = sqrt(s^2|P|^2 + tube^2 + 2 s tube sqrt((P.N)^2 + (P.B)^2))
       which is monotonic in s, so a few bisections put the knot's true hull
       exactly on the target radius whatever p, q and tube are. */
    var perp = new Float64Array(SAMPLES + 1);
    var plen = new Float64Array(SAMPLES + 1);
    for (i = 0; i <= SAMPLES; i++) {
      var bx0 = ty[i] * nz[i] - tz[i] * ny[i];
      var by0 = tz[i] * nx[i] - tx[i] * nz[i];
      var bz0 = tx[i] * ny[i] - ty[i] * nx[i];
      var dn = px[i] * nx[i] + py[i] * ny[i] + pz[i] * nz[i];
      var db = px[i] * bx0 + py[i] * by0 + pz[i] * bz0;
      perp[i] = Math.sqrt(dn * dn + db * db);
      plen[i] = Math.sqrt(px[i] * px[i] + py[i] * py[i] + pz[i] * pz[i]);
    }
    var hull = function (s) {
      var m = 0;
      for (var a = 0; a <= SAMPLES; a++) {
        var v2 = s * s * plen[a] * plen[a] + tube * tube + 2 * s * tube * perp[a];
        if (v2 > m) m = v2;
      }
      return Math.sqrt(m);
    };
    var target = pick(opts, 'radius', 0.995);
    var sLo = 0, sHi = target / Math.max(1e-6, maxR) + 1;
    for (i = 0; i < 24; i++) {
      var sm = (sLo + sHi) * 0.5;
      if (hull(sm) > target) sHi = sm; else sLo = sm;
    }
    var scale = (sLo + sHi) * 0.5;
    var phase = rng() * TAU;
    var sPhase = rng();

    for (var j = 0; j < n; j++) {
      /* perfectly even arc-length spacing, offset by a seeded phase */
      var s = (((j + sPhase) / n) % 1) * length;
      /* locate s in the arc table */
      var lo = 0, hi = SAMPLES;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (arc[mid + 1] <= s) lo = mid + 1;
        else hi = mid;
      }
      var seg = arc[lo + 1] - arc[lo];
      var f = seg > 1e-15 ? (s - arc[lo]) / seg : 0;
      var i0 = lo, i1 = lo + 1;

      var cxp = px[i0] + (px[i1] - px[i0]) * f;
      var cyp = py[i0] + (py[i1] - py[i0]) * f;
      var czp = pz[i0] + (pz[i1] - pz[i0]) * f;
      var fnx = nx[i0] + (nx[i1] - nx[i0]) * f;
      var fny = ny[i0] + (ny[i1] - ny[i0]) * f;
      var fnz = nz[i0] + (nz[i1] - nz[i0]) * f;
      var ftx = tx[i0] + (tx[i1] - tx[i0]) * f;
      var fty = ty[i0] + (ty[i1] - ty[i0]) * f;
      var ftz = tz[i0] + (tz[i1] - tz[i0]) * f;
      var tl = Math.sqrt(ftx * ftx + fty * fty + ftz * ftz) || 1;
      ftx /= tl; fty /= tl; ftz /= tl;
      /* re-orthogonalise the interpolated normal against the tangent */
      var dot = fnx * ftx + fny * fty + fnz * ftz;
      fnx -= ftx * dot; fny -= fty * dot; fnz -= ftz * dot;
      var nl = Math.sqrt(fnx * fnx + fny * fny + fnz * fnz) || 1;
      fnx /= nl; fny /= nl; fnz /= nl;
      var fbx = fty * fnz - ftz * fny;
      var fby = ftz * fnx - ftx * fnz;
      var fbz = ftx * fny - fty * fnx;

      /* golden-angle roll: the tube fills evenly without stripes */
      var phi = GOLDEN_ANGLE * j + phase;
      var rt = tube > 0 ? tube * Math.sqrt(1 - fill * rng() * (2 - fill)) : 0;
      var ca = Math.cos(phi) * rt, sa2 = Math.sin(phi) * rt;

      var o = j * 3;
      out[o] = (cxp + fnx * ca + fbx * sa2) * scale;
      out[o + 1] = (cyp + fny * ca + fby * sa2) * scale;
      out[o + 2] = (czp + fnz * ca + fbz * sa2) * scale;
    }
    return fit(out, FIT_LIMIT);
  }

  /* ══ wave ══════════════════════════════════════════════════════════════ */

  /* A near-square sheet on the xz plane lifted by two circular waves from two
     sources — the two-slit interference figure, which has far more structure
     than crossed plane waves. Each grid cell gets one stratified sample so the
     sheet reads as a continuous surface rather than a fly screen. */
  function wave(count, opts) {
    var out = alloc(count);
    var n = out.length / 3;
    if (n === 0) return out;

    var half = pick(opts, 'extent', 0.7);
    var amp = pick(opts, 'amplitude', 0.09);
    var k = pick(opts, 'frequency', 26);
    var sep = pick(opts, 'separation', 0.5);
    var decay = pick(opts, 'decay', 1.6);
    var jitter = clamp(pick(opts, 'jitter', 0.85), 0, 1);
    var rng = mulberry32(hashSeed(opts && opts.seed));

    var ph1 = rng() * TAU, ph2 = rng() * TAU;
    var s1x = -sep, s1z = -sep * 0.35;
    var s2x = sep, s2z = sep * 0.35;

    visitGrid(n, function (idx, col, rowI, cols, rows) {
      var jx = 0.5 + (rng() - 0.5) * jitter;
      var jz = 0.5 + (rng() - 0.5) * jitter;
      var x = ((col + jx) / cols) * 2 * half - half;
      var z = ((rowI + jz) / rows) * 2 * half - half;

      var d1 = Math.sqrt((x - s1x) * (x - s1x) + (z - s1z) * (z - s1z));
      var d2 = Math.sqrt((x - s2x) * (x - s2x) + (z - s2z) * (z - s2z));
      var a1 = 1 / (1 + decay * d1);
      var a2 = 1 / (1 + decay * d2);
      var y = amp * (a1 * Math.sin(k * d1 - ph1) + a2 * Math.sin(k * d2 - ph2));

      var o = idx * 3;
      out[o] = x;
      out[o + 1] = y;
      out[o + 2] = z;
    });
    return fit(out, FIT_LIMIT);
  }

  /* ══ ring ══════════════════════════════════════════════════════════════ */

  /* A Saturn annulus: area-correct radial sampling through a hand-authored
     density profile with two Cassini-style gaps and a stack of finer bands.
     Angles walk by the golden fraction, which spreads the points like a Vogel
     spiral — dense, even, and free of the clumps plain random angles give. */
  function ring(count, opts) {
    var out = alloc(count);
    var n = out.length / 3;
    if (n === 0) return out;

    var inner = pick(opts, 'inner', 0.45);
    var outer = pick(opts, 'outer', 0.97);
    var thickness = pick(opts, 'thickness', 0.008);
    var bandDepth = clamp(pick(opts, 'bands', 0.3), 0, 0.8);
    var rng = mulberry32(hashSeed(opts && opts.seed));

    /* {centre (0..1 across the annulus), width, depth} */
    var gaps = opts && opts.gaps ? opts.gaps : [
      { at: 0.6, width: 0.045, depth: 0.97 },   /* Cassini division */
      { at: 0.89, width: 0.014, depth: 0.85 }   /* Encke gap */
    ];

    var span = outer - inner;
    var cdf = buildCdf(2048, function (x) {
      var r = inner + x * span;
      var d = r;                                   /* area weighting */
      d *= 1 + bandDepth * Math.sin(TAU * 6.3 * x + 0.7)
             + bandDepth * 0.55 * Math.sin(TAU * 13.9 * x + 2.1);
      for (var g = 0; g < gaps.length; g++) {
        var t = (x - gaps[g].at) / gaps[g].width;
        d *= 1 - gaps[g].depth * Math.exp(-t * t);
      }
      d *= smoothstep(0, 0.02, x) * (1 - smoothstep(0.97, 1, x) * 0.9);
      return d;
    });

    var phase = rng();
    for (var i = 0; i < n; i++) {
      var u = (i + rng()) / n;
      var r = inner + sampleCdf(cdf, u) * span;
      var th = TAU * ((i * GOLDEN_FRACT + phase) % 1);
      var o = i * 3;
      out[o] = r * Math.cos(th);
      out[o + 1] = gaussClamped(rng, 2.5) * thickness;
      out[o + 2] = r * Math.sin(th);
    }
    return fit(out, FIT_LIMIT);
  }

  /* ══ cube ══════════════════════════════════════════════════════════════ */

  /* Six faces, equal area so equal share of the points, stratified inside each
     face. Half-size 0.575 puts the corners at radius 0.996 — as large as a cube
     can be inside the unit sphere. */
  function cube(count, opts) {
    var out = alloc(count);
    var n = out.length / 3;
    if (n === 0) return out;

    var half = pick(opts, 'size', 0.575);
    var jitter = clamp(pick(opts, 'jitter', 0.9), 0, 1);
    var rng = mulberry32(hashSeed(opts && opts.seed));

    var base = Math.floor(n / 6), extra = n % 6;
    /* which faces get the leftover points rotates with the seed */
    var offset = Math.floor(rng() * 6);
    var cursor = 0;
    for (var f = 0; f < 6; f++) {
      var face = (f + offset) % 6;
      var cnt = base + (f < extra ? 1 : 0);
      if (cnt === 0) continue;
      var axis = face >> 1;
      var sign = (face & 1) ? 1 : -1;
      var a0 = (axis + 1) % 3, a1 = (axis + 2) % 3;
      var start = cursor;
      visitGrid(cnt, function (idx, col, rowI, cols, rows) {
        var ju = 0.5 + (rng() - 0.5) * jitter;
        var jv = 0.5 + (rng() - 0.5) * jitter;
        var u = ((col + ju) / cols) * 2 - 1;
        var v = ((rowI + jv) / rows) * 2 - 1;
        var o = (start + idx) * 3;
        out[o + axis] = sign * half;
        out[o + a0] = u * half;
        out[o + a1] = v * half;
      });
      cursor += cnt;
    }
    return fit(out, FIT_LIMIT);
  }

  /* ══ heart ═════════════════════════════════════════════════════════════ */

  /* Taubin's heart: (x^2 + 9/4 y^2 + z^2 - 1)^3 - x^2 z^3 - 9/80 y^2 z^3 = 0.
   *
   * Along a ray p = t*d the implicit collapses to a two-coefficient polynomial
   *     F(t) = (A t^2 - 1)^3 - B t^5,  A = dx^2 + 9/4 dy^2 + dz^2,
   *                                    B = (dx^2 + 9/80 dy^2) dz^3
   * so the surface radius in any direction costs a handful of multiplies. The
   * surface is star-shaped about the origin, so one root per direction is all
   * there is.
   *
   * Even directions do NOT give even points — a star-shaped surface stretches
   * solid angle by r^2 / cos(angle between the ray and the normal). So we weigh
   * a Fibonacci lattice of directions by exactly that factor, resample it, and
   * jitter each survivor inside its own lattice cell.
   *
   * Equation space has z up and y as the thin axis; the output is rotated -90
   * degrees about x, giving lobes up (+y), the tip down, and the heart facing a
   * viewer who looks down -z.
   */
  var HEART_TMAX = 3;

  function heartRoot(dx, dy, dz) {
    var A = dx * dx + 2.25 * dy * dy + dz * dz;
    var B = (dx * dx + 0.1125 * dy * dy) * dz * dz * dz;
    var STEPS = 40;
    var prevT = 0, prevF = -1;         /* F(0) = -1 */
    var loT = -1, hiT = -1;
    for (var i = 1; i <= STEPS; i++) {
      var t = (i / STEPS) * HEART_TMAX;
      var g = A * t * t - 1;
      var fv = g * g * g - B * t * t * t * t * t;
      if ((fv >= 0) !== (prevF >= 0)) { loT = prevT; hiT = t; }
      prevT = t; prevF = fv;
    }

    mode = 'free';
    releasedAt = 0;
    if (prevMode === 'text' && prevWord) { $('word').value = prevWord; setWord(prevWord); }
    else setScene(scene);
    paintChips();
  }

  var prevMode = 'free', prevWord = '';

  /* ── hud ───────────────────────────────────────────────────────────── */

  var hudAt = 0;
  function hud(t) {
    if (t - hudAt < 400) return;
    hudAt = t;
    var extra = mode === 'gravity'
      ? '<br>重力 ' + ((t - releasedAt) / 1000).toFixed(0) + ' 秒'
      : '';
    $('hud').innerHTML =
      '<b>' + engine.count.toLocaleString('ja-JP') + '</b> 粒<br>' +
      Math.round(engine.fps) + ' fps' + extra;
  }

  /* ── pointer ───────────────────────────────────────────────────────── */

  function ndc(e) {
    var c = $('stage');
    var r = c.getBoundingClientRect();
    return [
      ((e.clientX - r.left) / Math.max(r.width, 1)) * 2 - 1,
      -(((e.clientY - r.top) / Math.max(r.height, 1)) * 2 - 1)
    ];
  }

  function bindPointer() {
    var c = $('stage');
    var down = false;

    c.addEventListener('pointerdown', function (e) {
      down = true;
      if (c.setPointerCapture) { try { c.setPointerCapture(e.pointerId); } catch (err) {} }
      var p = ndc(e);
      engine.setPointer(p[0], p[1], 1);
      finePointer = e.pointerType === 'mouse';
    });

    c.addEventListener('pointermove', function (e) {
      var p = ndc(e);
      if (down) engine.setPointer(p[0], p[1], 1);
      else if (e.pointerType === 'mouse') engine.setPointer(p[0], p[1], 0.32);
    });

    var release = function () { down = false; engine.setPointer(engine.pointer.x, engine.pointer.y, 0); };
    c.addEventListener('pointerup', release);
    c.addEventListener('pointercancel', release);
    c.addEventListener('pointerleave', function (e) { if (!down) release(); });

    c.addEventListener('dblclick', function (e) {
      var p = ndc(e);
      engine.setPointer(p[0], p[1], 3.2);
      burstUntil = performance.now() + 220;
    });
  }

  /* ── loop ──────────────────────────────────────────────────────────── */

  function tick(t) {
    requestAnimationFrame(tick);
    if (!running || !engine) return;
    var dt = last ? t - last : 16;
    last = t;

    if (burstUntil && t > burstUntil) { burstUntil = 0; engine.setPointer(engine.pointer.x, engine.pointer.y, 0); }

    /* Follow the collapse. The cloud shrinks by a factor of five on its way
       in, so a fixed camera either clips it at the start or loses it at the
       end. Radius comes from a small readback twice a second. */
    if (mode === 'gravity') {
      if (t - gravSampleAt > 500) {
        gravSampleAt = t;
        try {
          var rad = engine.sampleRadius(32);
          if (isFinite(rad.rms) && rad.rms > 0) {
            distTarget = frameDistance(1.85, Math.max(0.3, rad.rms * 2.0));
          }
        } catch (err) { distTarget = 0; }
      }
      if (distTarget) {
        engine.params.dist += (distTarget - engine.params.dist) * Math.min(1, dt / 1000 * 0.7);
      }
    }

    if (mode === 'text') {
      // Bring the field face-on so the word stays readable.
      var s = engine.spin % (Math.PI * 2);
      if (s > Math.PI) s -= Math.PI * 2;
      if (s < -Math.PI) s += Math.PI * 2;
      engine.spin -= s * Math.min(1, dt / 1000 * 3.2);
    }

    engine.resize();
    engine.frame(dt);
    hud(t);

    // Give the GPU a few seconds, then step down if it is clearly struggling.
    if (!probeAt) probeAt = t + 3000;
    else if (t > probeAt && drops < 3 && mode !== 'gravity') {
      if (engine.fps < 40 && tier < TIERS.length - 1) {
        tier++; drops++;
        engine.setCount(TIERS[tier]);
        refreshTargets();
      }
      probeAt = t + 2600;
    }
  }

  /* ── boot ──────────────────────────────────────────────────────────── */

  function fail(err) {
    $('fail').hidden = false;
    $('fail-msg').textContent = /WebGL2/.test(err.message)
      ? 'この端末またはブラウザが WebGL2 に対応していないようです。'
      : '描画の初期化に失敗しました。';
    $('fail-detail').textContent = err.message;
  }

  function buildChips() {
    var host = $('chips');
    var S = globalThis.HotaruShapes;
    var html = '';
    for (var i = 0; i < SHAPES.length; i++) {
      var s = SHAPES[i];
      if (s.key !== 'free' && !(S && typeof S[s.key] === 'function')) continue;
      html += '<button type="button" data-key="' + s.key + '" aria-pressed="' +
        (s.key === scene) + '">' + s.label + '</button>';
    }
    host.innerHTML = html;
    paintChips();
    host.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button[data-key]') : null;
      if (b) setScene(b.getAttribute('data-key'));
    });
  }

  function bindInput() {
    var input = $('word');
    var timer;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      var v = input.value.trim();
      timer = setTimeout(function () {
        if (v) setWord(v); else setScene(scene);
      }, 280);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        clearTimeout(timer);
        var v = input.value.trim();
        if (v) setWord(v);
        input.blur();
      }
    });
    $('release').addEventListener('click', function () {
      if (mode === 'gravity') unrelease(); else release();
    });
    $('clear').addEventListener('click', function () {
      input.value = '';
      setScene(scene);
      input.focus();
    });
  }

  // ?n=65536 (or #n=65536) pins the particle count — used when driving the page
  // from a test harness, and handy on a machine you want to go easy on.
  function requestedCount() {
    var m = /[?#&]n=(\d+)/.exec(location.search + location.hash);
    if (!m) return 0;
    var n = parseInt(m[1], 10);
    return n >= 1024 && n <= TIERS[0] ? n : 0;
  }

  function start() {
    var coarse = false;
    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    var small = Math.min(window.innerWidth, window.innerHeight) < 620;
    tier = (coarse || small) ? 2 : 0;

    var pinned = requestedCount();
    try {
      engine = new HotaruEngine($('stage'), {
        count: pinned || TIERS[tier],
        // Only a harness needs to read the canvas back after a frame is presented.
        preserveBuffer: /[?#&]grab=1/.test(location.search + location.hash)
      });
    } catch (err) {
      fail(err);
      return;
    }
    if (pinned) drops = 3;

    globalThis.__hotaru = {
      get engine() { return engine; },
      get mode() { return mode; },
      get scene() { return scene; },
      setWord: setWord,
      setScene: setScene
    };

    applyPreset('free', null, sceneRadius('free'));
    engine.setTargets(shapeTargets('free', engine.count));

    buildChips();
    bindInput();
    bindPointer();

    document.addEventListener('visibilitychange', function () {
      running = !document.hidden;
      last = 0;
    });

    // How large a word can be drawn depends on the viewport, so re-cut it when
    // the window changes shape (or a phone is turned on its side).
    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (mode === 'text' && word) setWord(word);
        else applyPreset(scene === 'free' ? 'free' : 'shape', SHAPE_TWEAK[scene], sceneRadius(scene));
      }, 260);
    });

    // Re-cut the glyphs once the real typeface has arrived.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { if (mode === 'text' && word) setWord(word); });
    }

    requestAnimationFrame(tick);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
